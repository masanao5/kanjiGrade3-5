      body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }

      /* 答えが表示されるときの上質で滑らかなバウンドフェードインアニメーション */
      @keyframes revealAnswer {
          0% {
              opacity: 0;
              transform: scale(0.96) translateY(8px);
              filter: blur(4px);
          }
          60% {
              transform: scale(1.01) translateY(-1px);
              filter: blur(0px);
          }
          100% {
              opacity: 1;
              transform: scale(1) translateY(0);
              filter: blur(0px);
          }
      }
      .animate-reveal {
          animation: revealAnswer 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* 音声認識中のマイクアニメーション */
      @keyframes micPulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.15); opacity: 0.7; }
      }
      .animate-mic {
          animation: micPulse 1.2s ease-in-out infinite;
      }
  </style>

      // CSV, TSV, スペース等に対応するパーサー (問題文 q をユニークキーとする)
      function parseProblemData(text) {
          return text.split('\n')
              .map(line => line.trim())
              .filter(line => line.length > 0)
              .map((line, i) => {
                  let q = '';
                  let a = '';
                  
                  if (line.includes('\t')) {
                      const parts = line.split('\t');
                      q = parts[0].trim();
                      a = parts[1].trim();
                  } else if (line.includes(',')) {
                      const parts = line.split(',');
                      q = parts[0].trim();
                      a = parts[1].trim();
                  } else {
                      const match = line.match(/^(.+?)[\s　]+(.+)$/);
                      if (match) {
                          q = match[1].trim();
                          a = match[2].trim();
                      } else {
                          q = line.trim();
                          a = '？';
                      }
                  }
                  return { id: i + 1, q, a, w: 100, ok: false, star: false };
              });
      }

      function App() {
          // 1. ローカルストレージ（自分でカスタムしたデータ）を優先し、なければコード内のDEFAULTを使用
          const [rawText, setRawText] = useState(() => {
              return localStorage.getItem(CUSTOM_DATA_KEY) || DEFAULT_EXCEL_DATA;
          });

          const initialData = useMemo(() => {
              return parseProblemData(rawText);
          }, [rawText]);

          const [items, setItems] = useState([]);
          const [activeMode, setActiveMode] = useState('all');
          const [currentItem, setCurrentItem] = useState(null);
          const [isRevealed, setIsRevealed] = useState(false);
          const [isFinished, setIsFinished] = useState(false);
          const [appTitleName, setAppTitleName] = useState(document.title);

          // --- 設定 state（読み上げ・聞き取り・プリセット対応） ---
          const [settings, setSettings] = useState({ 
              darkMode: DEFAULT_DARK_MODE, 
              autoSpeak: DEFAULT_AUTO_SPEAK, 
              rateIndex: DEFAULT_SPEECH_RATE, 
              fontSizeQIndex: DEFAULT_FONT_SIZE_Q, 
              fontSizeAIndex: DEFAULT_FONT_SIZE_A, 
              reverseMode: DEFAULT_REVERSE_MODE,
              showCanvas: DEFAULT_SHOW_CANVAS,
              showSpeakButton: DEFAULT_SHOW_SPEAK_BUTTON,
              enableDictation: DEFAULT_ENABLE_DICTATION,
              enableKeyboardSpeak: DEFAULT_ENABLE_KEYBOARD_SPEAK,
              enableInput: DEFAULT_ENABLE_INPUT,
              canvasPosition: DEFAULT_CANVAS_POSITION,
              displayScale: DEFAULT_DISPLAY_SCALE,
              leaderboardName: DEFAULT_LEADERBOARD_NAME
          });

          // プリセット管理
          const [presets, setPresets] = useState([]);
          const [presetName, setPresetName] = useState('');
          const [showPresetSave, setShowPresetSave] = useState(false);

          // 聞き取り（音声認識）
          const [isListening, setIsListening] = useState(false);
          const [dictationResult, setDictationResult] = useState('');
          const recognitionRef = useRef(null);

          // テキスト入力モード（キーボードで答えを入力）
          const [inputValue, setInputValue] = useState('');
          const [inputResult, setInputResult] = useState(null); // null | 'correct' | 'incorrect'
          const inputRef = useRef(null);

          const [modals, setModals] = useState({ menu: false, list: false, edit: false });
          const [activeTab, setActiveTab] = useState('study'); 
          const [tempRawText, setTempRawText] = useState(rawText);
          const [toast, setToast] = useState({ message: '', visible: false });
          const [listFilter, setListFilter] = useState('all');
          const [leaderboardType, setLeaderboardType] = useState('total');
          const [leaderboardData, setLeaderboardData] = useState(null);
          const [leaderboardLoading, setLeaderboardLoading] = useState(false);

          // キャンバス操作
          const canvasRef = useRef(null);
          const canvasRightRef = useRef(null);
          const isDrawing = useRef(false);
          const lastX = useRef(0);
          const lastY = useRef(0);
          const lastTime = useRef(0);
          const currentStrokeWidth = useRef(4.0);
          // どのキャンバスに描画中か
          const activeCanvasRef = useRef(null);

          // 最新の問題データを items から抽出
          const currentItemDetail = useMemo(() => {
              if (!currentItem) return null;
              return items.find(i => i.q === currentItem.q) || currentItem;
          }, [items, currentItem]);

          const activeItems = useMemo(() => {
              if (activeMode === 'star') return items.filter(i => i.star);
              if (activeMode === 'ng') return items.filter(i => !i.ok);
              if (activeMode === 'ok') return items.filter(i => i.ok);
              return items;
          }, [items, activeMode]);

          // プリセット読み込み
          useEffect(() => {
              const saved = localStorage.getItem(PRESETS_KEY);
              if (saved) {
                  try { setPresets(JSON.parse(saved)); } catch(e) {}
              } else {
                  setPresets(DEFAULT_PRESETS);
                  localStorage.setItem(PRESETS_KEY, JSON.stringify(DEFAULT_PRESETS));
              }
          }, []);

          // 初回ロード
          useEffect(() => {
              const savedData = localStorage.getItem(STORAGE_KEY_V2);
              let loadedItems = [...initialData];
              if (savedData) {
                  try {
                      const pd = JSON.parse(savedData);
                      loadedItems = loadedItems.map(item => {
                          const history = pd[item.q];
                          return history ? { ...item, ...history } : item;
                      });
                  } catch(e) {}
              }
              setItems(loadedItems);

              const s = localStorage.getItem(SETTINGS_KEY);
              if (s) {
                  try {
                      const p = JSON.parse(s);
                      setSettings(prev => ({ ...prev, ...p }));
                      if (p.darkMode) document.documentElement.classList.add('dark');
                  } catch(e) {}
              }
          }, [initialData]);

          useEffect(() => {
              if (items.length > 0 && !currentItem && !isFinished) {
                 nextQuestion(items, activeMode);
              }
          }, [items]);

          // SpeechRecognition 初期化
          useEffect(() => {
              if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                  const recognition = new SpeechRecognition();
                  recognition.lang = 'ja-JP';
                  recognition.continuous = false;
                  recognition.interimResults = true;
                  
                  recognition.onresult = (event) => {
                      const transcript = Array.from(event.results)
                          .map(r => r[0].transcript)
                          .join('');
                      setDictationResult(transcript);
                  };
                  
                  recognition.onerror = (event) => {
                      if (event.error !== 'aborted') {
                          showToast('音声認識エラー: ' + event.error);
                      }
                      setIsListening(false);
                  };
                  
                  recognition.onend = () => {
                      setIsListening(false);
                  };
                  
                  recognitionRef.current = recognition;
              }
          }, []);

          // ロバストな進捗セーブ（問題文 q をキーにしたMAP構造で保存）
          const saveItems = (newItems) => {
              setItems(newItems);
              const dataToSave = {};
              newItems.forEach(i => { 
                  if (i.ok || i.star || i.w !== 100) {
                      dataToSave[i.q] = { w: i.w, ok: i.ok, star: i.star }; 
                  }
              });
              localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(dataToSave));
          };

          const nextQuestion = (currentItems, mode) => {
              let targetGroup = currentItems;
              let unmastered = [];

              if (mode === 'star') {
                  targetGroup = currentItems.filter(i => i.star);
                  unmastered = targetGroup.filter(i => !i.sessionDone);
              } else if (mode === 'ng') {
                  targetGroup = currentItems.filter(i => !i.ok);
                  unmastered = targetGroup.filter(i => !i.ok);
              } else if (mode === 'ok') {
                  targetGroup = currentItems.filter(i => i.ok);
                  unmastered = targetGroup.filter(i => !i.sessionDone);
              } else {
                  targetGroup = currentItems;
                  unmastered = targetGroup.filter(i => !i.ok);
              }

              if (unmastered.length === 0) {
                  setIsFinished(true);
                  setCurrentItem(null);
                  return;
              }

              setIsFinished(false);
              setDictationResult('');
              setInputValue('');
              setInputResult(null);
              
              const totalW = unmastered.reduce((s, i) => s + i.w, 0);
              let r = Math.random() * totalW;
              let selected = null;
              for (let i of unmastered) {
                  if (r < i.w) { selected = i; break; }
                  r -= i.w;
              }
              setCurrentItem(selected);
              setIsRevealed(false);
              clearCanvas(); 
          };

          const clearCanvas = () => {
              [canvasRef.current, canvasRightRef.current].forEach(c => {
                  if (!c) return;
                  const ctx = c.getContext('2d');
                  ctx.clearRect(0, 0, c.width, c.height);
              });
          };

          const handleReveal = useCallback(() => {
              if (!currentItemDetail || isRevealed) return;
              setIsRevealed(true);
              
              const textToSpeak = settings.reverseMode ? currentItemDetail.q : currentItemDetail.a;
              if (settings.autoSpeak) speak(textToSpeak, settings.rateIndex);
          }, [currentItemDetail, isRevealed, settings]);

          const handleInputSubmit = useCallback(() => {
              if (!currentItemDetail || isRevealed || !inputValue.trim()) return;
              setIsRevealed(true);
              const correctAnswer = (settings.reverseMode ? currentItemDetail.q : currentItemDetail.a).trim();
              const userAnswer = inputValue.trim();
              const isCorrect = userAnswer === correctAnswer || 
                  userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');
              setInputResult(isCorrect ? 'correct' : 'incorrect');
              const textToSpeak = settings.reverseMode ? currentItemDetail.q : currentItemDetail.a;
              if (settings.autoSpeak) speak(textToSpeak, settings.rateIndex);
          }, [currentItemDetail, isRevealed, inputValue, settings]);

          const handleResult = useCallback((isOk) => {
              if (!currentItemDetail || !isRevealed) return;
              const newItems = items.map(item => {
                  if (item.q === currentItemDetail.q) {
                      if (activeMode === 'star') {
                          return { 
                              ...item, 
                              w: isOk ? 1 : item.w + 200, 
                              ok: isOk ? true : item.ok, 
                              star: isOk ? false : item.star, 
                              sessionDone: isOk 
                          };
                      } else {
                          return { 
                              ...item, 
                              w: isOk ? 1 : item.w + 200, 
                              ok: isOk,
                              sessionDone: isOk
                          };
                      }
                  }
                  return item;
              });
              if (isOk) updateLeaderboardStats(1);
              saveItems(newItems);
              nextQuestion(newItems, activeMode);
          }, [currentItemDetail, isRevealed, items, activeMode]);

          const toggleStar = (id) => {
              const newItems = items.map(item => item.id === id ? { ...item, star: !item.star } : item);
              saveItems(newItems);
              const target = newItems.find(i => i.id === id);
              if (target) {
                 showToast(target.star ? "★ 要復習に追加" : "★ 要復習から外しました");
              }
          };

          const speak = (text, rateIdx = settings.rateIndex) => {
              if (!text || !('speechSynthesis' in window)) return;
              window.speechSynthesis.cancel();
              const u = new SpeechSynthesisUtterance(text);
              
              const englishPattern = /^[A-Za-z0-9\s,.:?!'"()\-]+$/;
              if (englishPattern.test(text.replace(/[\s\d]/g, ''))) {
                  u.lang = 'en-US';
              } else {
                  u.lang = 'ja-JP';
              }
              
              const targetRate = speechRates[rateIdx]?.value || 1.0;
              u.rate = targetRate;
              window.speechSynthesis.speak(u);
          };

          const toggleDictation = () => {
              if (!recognitionRef.current) {
                  showToast('お使いのブラウザは音声認識に対応していません');
                  return;
              }
              if (isListening) {
                  recognitionRef.current.stop();
                  setIsListening(false);
              } else {
                  setDictationResult('');
                  try {
                      recognitionRef.current.start();
                      setIsListening(true);
                  } catch(e) {
                      showToast('音声認識を開始できません');
                  }
              }
          };

          const updateSetting = (key, value) => {
              const newSettings = { ...settings, [key]: value };
              setSettings(newSettings);
              localStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings));
              if (key === 'darkMode') {
                  if (value) document.documentElement.classList.add('dark');
                  else document.documentElement.classList.remove('dark');
              }
          };

          const applyPreset = (preset) => {
              const newSettings = { ...settings, ...preset.settings };
              setSettings(newSettings);
              localStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings));
              if (newSettings.darkMode) document.documentElement.classList.add('dark');
              else document.documentElement.classList.remove('dark');
              showToast(`プリセット「${preset.name}」を適用しました`);
          };

          const savePreset = () => {
              if (!presetName.trim()) return;
              const newPreset = {
                  id: `preset_${Date.now()}`,
                  name: presetName.trim(),
                  settings: { ...settings }
              };
              const updated = [...presets, newPreset];
              setPresets(updated);
              localStorage.setItem(PRESETS_KEY, JSON.stringify(updated));
              setPresetName('');
              setShowPresetSave(false);
              showToast(`プリセット「${newPreset.name}」を保存しました`);
          };

          const deletePreset = (id, e) => {
              e.stopPropagation();
              const updated = presets.filter(p => p.id !== id);
              setPresets(updated);
              localStorage.setItem(PRESETS_KEY, JSON.stringify(updated));
              showToast('プリセットを削除しました');
          };

          const showToast = (msg) => {
              setToast({ message: msg, visible: true });
              setTimeout(() => setToast({ message: '', visible: false }), 2000);
          };

          const startFocusedLearning = () => {
              const newItems = items.map(i => ({ ...i, sessionDone: false }));
              setItems(newItems);
              
              setActiveMode(listFilter);
              setModals({ ...modals, list: false });
              nextQuestion(newItems, listFilter);
              showToast("集中学習モードを開始しました");
          };

          const applyCustomData = () => {
              localStorage.setItem(CUSTOM_DATA_KEY, tempRawText);
              setRawText(tempRawText);
              localStorage.removeItem(STORAGE_KEY_V2);
              setActiveMode('all');
              setModals(prev => ({ ...prev, edit: false }));
              showToast("新しい問題データを適用しました");
          };

          const resetToDefaultData = () => {
              if (window.confirm("デフォルトの漢字テスト問題に戻します。よろしいですか？")) {
                  localStorage.removeItem(CUSTOM_DATA_KEY);
                  localStorage.removeItem(STORAGE_KEY_V2);
                  setRawText(DEFAULT_EXCEL_DATA);
                  setTempRawText(DEFAULT_EXCEL_DATA);
                  setActiveMode('all');
                  setModals(prev => ({ ...prev, edit: false }));
                  showToast("デフォルトに戻しました");
              }
          };

          const resetAllData = () => {
              if (window.confirm("全学習履歴(進捗・★マーク)を削除して最初からやり直します。\nよろしいですか？")) {
                  localStorage.removeItem(STORAGE_KEY_V2);
                  const freshItems = parseProblemData(rawText);
                  setItems(freshItems);
                  setActiveMode('all');
                  setModals({ ...modals, menu: false });
                  nextQuestion(freshItems, 'all');
                  showToast("学習データをリセットしました");
              }
          };

          const downloadFile = (filename, content, mimeType) => {
              const blob = new Blob([content], { type: mimeType });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = filename;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
          };

          const exportJSON = () => {
              const data = {
                  version: 1,
                  exportedAt: new Date().toISOString(),
                  appTitle: appTitle,
                  settings: settings,
                  presets: presets,
                  progress: Object.fromEntries(items.filter(i => i.ok || i.star || i.w !== 100).map(i => [i.q, { w: i.w, ok: i.ok, star: i.star }])),
                  customData: rawText
              };
              downloadFile(`${appTitle}_backup.json`, JSON.stringify(data, null, 2), 'application/json');
              showToast('設定とデータをエクスポートしました');
          };

          const importJSON = () => {
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = '.json';
              input.onchange = (e) => {
                  const file = e.target.files[0];
                  if (!file) return;
                  const reader = new FileReader();
                  reader.onload = (ev) => {
                      try {
                          const data = JSON.parse(ev.target.result);
                          if (!window.confirm(`バックアップを読み込みます。現在の設定・進捗・データは上書きされます。\nエクスポート日時: ${data.exportedAt || '不明'}\nよろしいですか？`)) return;
                          
                          if (data.settings) {
                              setSettings(data.settings);
                              localStorage.setItem(SETTINGS_KEY, JSON.stringify(data.settings));
                              if (data.settings.darkMode) document.documentElement.classList.add('dark');
                              else document.documentElement.classList.remove('dark');
                          }
                          if (data.presets) {
                              setPresets(data.presets);
                              localStorage.setItem(PRESETS_KEY, JSON.stringify(data.presets));
                          }
                          if (data.customData !== undefined) {
                              setRawText(data.customData);
                              localStorage.setItem(CUSTOM_DATA_KEY, data.customData);
                              localStorage.removeItem(STORAGE_KEY_V2);
                              const finalItems = parseProblemData(data.customData);
                              if (data.progress) {
                                  const merged = finalItems.map(item => ({
                                      ...item,
                                      ...(data.progress[item.q] || {})
                                  }));
                                  setItems(merged);
                                  saveItemsRaw(merged);
                              } else {
                                  setItems(finalItems);
                                  saveItemsRaw(finalItems);
                              }
                              setActiveMode('all');
                          } else if (data.progress) {
                              const newItems = items.map(item => ({
                                  ...item,
                                  ...(data.progress[item.q] || {})
                              }));
                              setItems(newItems);
                              saveItemsRaw(newItems);
                          }
                          showToast('バックアップを読み込みました');
                      } catch(err) {
                          showToast('JSONの解析に失敗しました');
                      }
                  };
                  reader.readAsText(file);
              };
              input.click();
          };

          const saveItemsRaw = (newItems) => {
              const dataToSave = {};
              newItems.forEach(i => { 
                  if (i.ok || i.star || i.w !== 100) {
                      dataToSave[i.q] = { w: i.w, ok: i.ok, star: i.star }; 
                  }
              });
              localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(dataToSave));
          };

          // --- リーダーボード連携 ---
          const getUserName = () => settings.leaderboardName || '';
          
          const getUserId = () => {
              let id = localStorage.getItem(LEADERBOARD_USER_KEY);
              if (!id) {
                  id = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
                  localStorage.setItem(LEADERBOARD_USER_KEY, id);
              }
              return id;
          };

          const getLeaderboardStats = () => {
              try {
                  return JSON.parse(localStorage.getItem(LEADERBOARD_STATS_KEY)) || { todayDate: '', todayCount: 0, totalMastered: 0, streak: 0, lastDate: '' };
              } catch(e) { return { todayDate: '', todayCount: 0, totalMastered: 0, streak: 0, lastDate: '' }; }
          };

          const saveLeaderboardStats = (stats) => {
              localStorage.setItem(LEADERBOARD_STATS_KEY, JSON.stringify(stats));
          };

          const updateLeaderboardStats = (newlyMastered) => {
              if (newlyMastered <= 0) return;
              const stats = getLeaderboardStats();
              const today = new Date().toISOString().slice(0, 10);
              
              if (stats.todayDate !== today) {
                  const yesterday = new Date();
                  yesterday.setDate(yesterday.getDate() - 1);
                  const yesterdayStr = yesterday.toISOString().slice(0, 10);
                  if (stats.lastDate === yesterdayStr || stats.lastDate === today) {
                      stats.streak = (stats.streak || 0) + 1;
                  } else if (stats.lastDate !== today) {
                      stats.streak = 1;
                  }
                  stats.todayDate = today;
                  stats.todayCount = newlyMastered;
              } else {
                  stats.todayCount += newlyMastered;
              }
              stats.totalMastered = (stats.totalMastered || 0) + newlyMastered;
              stats.lastDate = today;
              saveLeaderboardStats(stats);
          };

          const getStudySeconds = () => {
              const start = localStorage.getItem(LEADERBOARD_SESSION_START);
              if (!start) {
                  localStorage.setItem(LEADERBOARD_SESSION_START, Date.now());
                  return 0;
              }
              return Math.floor((Date.now() - parseInt(start)) / 1000);
          };

          const submitToLeaderboard = () => {
              if (!LEADERBOARD_URL) return;
              const name = getUserName();
              if (!name) return;
              const stats = getLeaderboardStats();
              const payload = {
                  userId: getUserId(),
                  userName: name,
                  appTitle: appTitle,
                  masteredToday: stats.todayCount || 0,
                  totalMastered: stats.totalMastered || 0,
                  streak: stats.streak || 0,
                  studySeconds: getStudySeconds()
              };
              try {
                  fetch(LEADERBOARD_URL, {
                      method: 'POST',
                      mode: 'no-cors',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(payload)
                  });
              } catch(e) {}
          };

          const openLeaderboard = () => {
              if (LEADERBOARD_URL) {
                  window.open(LEADERBOARD_URL, '_blank');
              } else {
                  showToast('リーダーボードURLが未設定です');
              }
          };

          const fetchLeaderboardInline = (type = 'total') => {
              if (!LEADERBOARD_URL) return;
              setLeaderboardLoading(true);
              setLeaderboardType(type);
              const params = new URLSearchParams({ mode: 'json', type: type, limit: 30 });
              if (appTitle) params.set('app', appTitle);
              fetch(`${LEADERBOARD_URL}?${params}`)
                  .then(r => r.json())
                  .then(data => {
                      setLeaderboardData(data);
                      setLeaderboardLoading(false);
                  })
                  .catch(() => {
                      setLeaderboardData({ error: '接続できませんでした' });
                      setLeaderboardLoading(false);
                  });
          };

          // キャンバス描画（Pointer Events対応・筆圧検知）
          const draw = (e) => {
              const canvas = activeCanvasRef.current;
              if (!isDrawing.current || !canvas) return;
              e.preventDefault();
              const ctx = canvas.getContext('2d');
              
              let clientX, clientY, pressure = 0.5;
              if (e.touches && e.touches.length > 0) {
                  clientX = e.touches[0].clientX;
                  clientY = e.touches[0].clientY;
                  if (e.touches[0].force !== undefined) {
                      pressure = Math.max(0.1, e.touches[0].force);
                  }
              } else {
                  clientX = e.clientX;
                  clientY = e.clientY;
                  const native = e.nativeEvent || e;
                  if (native.pressure !== undefined && native.pressure > 0) {
                      pressure = native.pressure;
                  }
              }

              const rect = canvas.getBoundingClientRect();
              const scaleX = canvas.width / rect.width;
              const scaleY = canvas.height / rect.height;
              
              const x = (clientX - rect.left) * scaleX;
              const y = (clientY - rect.top) * scaleY;

              const now = Date.now();
              const dt = now - lastTime.current;
              const dx = x - lastX.current;
              const dy = y - lastY.current;
              const dist = Math.sqrt(dx * dx + dy * dy);
              
              let speed = dist / (dt || 1);
              if (speed > 5) speed = 5;

              const native = e.nativeEvent || e;
              let targetWidth = 4.5;
              if (native.pointerType === 'pen' || (e.touches && e.touches.length > 0)) {
                  targetWidth = 1.5 + (pressure * 8.5); 
              } else {
                  targetWidth = 6.8 - (speed * 1.0); 
              }

              currentStrokeWidth.current = currentStrokeWidth.current * 0.72 + targetWidth * 0.28;
              if (currentStrokeWidth.current < 1.5) currentStrokeWidth.current = 1.5;
              if (currentStrokeWidth.current > 10.0) currentStrokeWidth.current = 10.0;

              ctx.lineWidth = currentStrokeWidth.current;
              ctx.beginPath();
              ctx.moveTo(lastX.current, lastY.current);
              ctx.lineTo(x, y);
              ctx.stroke();

              lastX.current = x;
              lastY.current = y;
              lastTime.current = now;
          };

          const startDrawing = (e) => {
              e.preventDefault();
              const canvas = e.target.closest('canvas');
              if (!canvas) return;
              activeCanvasRef.current = canvas;
              isDrawing.current = true;
              
              let clientX, clientY;
              if (e.touches && e.touches.length > 0) {
                  clientX = e.touches[0].clientX;
                  clientY = e.touches[0].clientY;
              } else {
                  clientX = e.clientX;
                  clientY = e.clientY;
              }

              const rect = canvas.getBoundingClientRect();
              const scaleX = canvas.width / rect.width;
              const scaleY = canvas.height / rect.height;

              lastX.current = (clientX - rect.left) * scaleX;
              lastY.current = (clientY - rect.top) * scaleY;
              lastTime.current = Date.now();
              currentStrokeWidth.current = 4.0;
          };

          const stopDrawing = (e) => {
              if (e) e.preventDefault();
              isDrawing.current = false;
          };

          // 高解像度（HD）対応キャンバス補正（両方のキャンバスに対応）
          useEffect(() => {
              const setupCanvas = (canvas) => {
                  if (!canvas) return;
                  const rect = canvas.getBoundingClientRect();
                  if (rect.width === 0 || rect.height === 0) return;
                  canvas.width = rect.width * 2;
                  canvas.height = rect.height * 2;
                  const ctx = canvas.getContext('2d');
                  ctx.lineWidth = 4.5;
                  ctx.lineCap = 'round';
                  ctx.lineJoin = 'round';
                  ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              };

              if (settings.showCanvas && !isFinished && currentItemDetail) {
                  const timer = setTimeout(() => {
                      setupCanvas(canvasRef.current);
                      if (settings.canvasPosition === 'right') {
                          setupCanvas(canvasRightRef.current);
                      }
                  }, 100);
                  return () => clearTimeout(timer);
              }
          }, [settings.showCanvas, currentItemDetail, isFinished, settings.darkMode, settings.canvasPosition, settings.displayScale]);

          // キーボードショートカット
          useEffect(() => {
              const handleKeyDown = (e) => {
                  if (modals.menu || modals.list || modals.edit || isFinished) return;
                  if (e.code === 'KeyS') { e.preventDefault(); if(currentItemDetail) toggleStar(currentItemDetail.id); return; }
                
                  if (!isRevealed) {
                      if (settings.enableInput) {
                          if (e.code === 'Enter') {
                              e.preventDefault();
                              handleInputSubmit();
                          }
                      } else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'ArrowDown') { 
                          e.preventDefault(); 
                          handleReveal(); 
                      }
                  } else {
                      if (e.code === 'ArrowLeft') { e.preventDefault(); handleResult(false); }
                      else if (e.code === 'ArrowRight') { e.preventDefault(); handleResult(true); }
                      else if ((e.code === 'Space' || e.code === 'Enter') && settings.enableKeyboardSpeak) { 
                          e.preventDefault(); 
                          const textToSpeak = settings.reverseMode ? currentItemDetail.q : currentItemDetail.a;
                          speak(textToSpeak); 
                      }
                  }
              };
              window.addEventListener('keydown', handleKeyDown);
              return () => window.removeEventListener('keydown', handleKeyDown);
          }, [modals, isFinished, isRevealed, currentItemDetail, handleReveal, handleResult, settings, handleInputSubmit]);

          // テキスト入力モードのときは次の問題で自動フォーカス
          useEffect(() => {
              if (settings.enableInput && !isRevealed && !isFinished && currentItemDetail && inputRef.current) {
                  const timer = setTimeout(() => { inputRef.current?.focus(); }, 200);
                  return () => clearTimeout(timer);
              }
          }, [currentItemDetail, settings.enableInput, isRevealed, isFinished]);

          // リーダーボード定期送信 (60秒ごと)
          useEffect(() => {
              if (!LEADERBOARD_URL || !getUserName()) return;
              submitToLeaderboard();
              const timer = setInterval(submitToLeaderboard, 60000);
              return () => clearInterval(timer);
          }, []);

          // 学習セッション開始
          useEffect(() => {
              localStorage.setItem(LEADERBOARD_SESSION_START, Date.now());
          }, []);

          const okCount = activeItems.filter(i => i.ok).length;
          const totalCount = activeItems.length;
          const progressPercent = totalCount === 0 ? 0 : Math.floor((okCount / totalCount) * 100);

          const getModeLabel = () => {
              if (activeMode === 'star') return '★ 要復習';
              if (activeMode === 'ng') return '未マスター';
              if (activeMode === 'ok') return 'マスター済';
              return '';
          };

          const displayQuestion = useMemo(() => {
              if (!currentItemDetail) return '';
              return settings.reverseMode ? currentItemDetail.a : currentItemDetail.q;
          }, [currentItemDetail, settings.reverseMode]);

          const displayAnswer = useMemo(() => {
              if (!currentItemDetail) return '';
              return settings.reverseMode ? currentItemDetail.q : currentItemDetail.a;
          }, [currentItemDetail, settings.reverseMode]);

          const classSizeQ = fontSizesQ[settings.fontSizeQIndex]?.class || 'text-xl sm:text-2xl';
          const classSizeA = fontSizesA[settings.fontSizeAIndex]?.class || 'text-2xl sm:text-3xl font-bold';

          return (
              <div className={`min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'items-start' : 'items-center'} justify-center p-4 transition-colors duration-200`}>
                
                  <div className={`flex ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'flex-row gap-4 items-start' : 'flex-col items-center'} w-full ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'max-w-[900px]' : 'max-w-lg'}`}>

                      <div className={`flex flex-col items-center ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'max-w-lg flex-1' : 'w-full'}`}>

                          {/* メインカード本体 */}
                          <div className="bg-white dark:bg-slate-900 w-full p-6 sm:p-8 rounded-3xl shadow-lg border border-slate-200/60 dark:border-slate-800/80 transition-colors duration-200 relative"
                              style={{ zoom: settings.displayScale }}>
                          
                          {/* ヘッダーエリア */}
                          <div className="flex justify-between items-center mb-5 border-b border-slate-100 dark:border-slate-850 pb-3">
                              <h1 className="text-lg font-bold tracking-tight text-slate-800 dark:text-slate-100">{appTitleName}</h1>
                              <div className="flex items-center gap-1">
                                  {/* 設定ボタン */}
                                  <button
                                      onClick={() => setModals({ ...modals, menu: true })}
                                      className="p-2 rounded-xl text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"
                                      title="設定を開く"
                                  >
                                      <IconSettings size={20} />
                                  </button>
                              </div>
                          </div>

                          {/* プログレスインジケーター */}
                          <div className="mb-4">
                              <div className="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mb-1.5">
                                  <div
                                      className="h-full bg-blue-500 dark:bg-blue-600 transition-all duration-300 ease-out"
                                      style={{ width: `${progressPercent}%` }}
                                  />
                              </div>
                              <div className="flex justify-between text-[11px] font-bold text-slate-400 dark:text-slate-500">
                                  <span>{okCount} / {totalCount} 問マスター</span>
                                  {activeMode !== 'all' && (
                                      <span className="bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded-full font-bold text-[10px]">
                                          {getModeLabel()}
                                      </span>
                                  )}
                              </div>
                          </div>

                          {!isFinished ? (
                              <div className="flex flex-col gap-4">
                                  
                                  {/* カードボードエリア */}
                                  <div className="relative min-h-[200px] flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-900/30 rounded-2xl p-4 border border-slate-100 dark:border-slate-800/40 overflow-hidden shadow-inner">
                                      
                                      {/* 要復習★ボタン */}
                                      <button
                                          onClick={() => toggleStar(currentItemDetail?.id)}
                                          className={`absolute top-2 right-2 p-1.5 rounded-full transition-transform active:scale-90 z-20 ${currentItemDetail?.star ? 'text-amber-400' : 'text-slate-300 dark:text-slate-700 hover:text-amber-400'}`}
                                          title="要復習 (Sキー)"
                                      >
                                          <IconStar size={22} fill={currentItemDetail?.star ? "currentColor" : "none"} />
                                      </button>

                                      {/* 読み上げボタン（答え表示時・個別読み上げ設定ON時） */}
                                      {settings.showSpeakButton && isRevealed && (
                                          <button
                                              onClick={() => speak(settings.reverseMode ? currentItemDetail.q : currentItemDetail.a)}
                                              className="absolute top-2 left-2 p-1.5 rounded-full transition-all active:scale-90 z-20 text-blue-500 hover:text-blue-600 hover:bg-blue-50 dark:text-blue-400 dark:hover:bg-blue-950/30"
                                              title="読み上げ (Space)"
                                          >
                                              <IconVolume2 size={20} />
                                          </button>
                                      )}

                                      {/* 手書きキャンバスレイヤー */}
                                      {settings.showCanvas && (
                                          <div className="absolute inset-0 w-full h-full z-10 select-none">
                                              <canvas
                                                  ref={canvasRef}
                                                  onPointerDown={startDrawing}
                                                  onPointerMove={draw}
                                                  onPointerUp={stopDrawing}
                                                  onPointerLeave={stopDrawing}
                                                  onMouseDown={startDrawing}
                                                  onMouseMove={draw}
                                                  onMouseUp={stopDrawing}
                                                  onMouseLeave={stopDrawing}
                                                  onTouchStart={startDrawing}
                                                  onTouchMove={draw}
                                                  onTouchEnd={stopDrawing}
                                                  className="w-full h-full cursor-crosshair animate-in fade-in"
                                                  style={{ touchAction: 'none' }}
                                              />
                                              {/* クリアボタン */}
                                              <button
                                                  onClick={clearCanvas}
                                                  className="absolute bottom-2 right-2 p-2 bg-white/80 dark:bg-slate-800/80 text-slate-400 hover:text-blue-500 dark:hover:text-blue-400 rounded-lg shadow-sm border border-slate-200/40 dark:border-slate-700/60 transition-all flex items-center justify-center pointer-events-auto"
                                                  title="書いた文字を消去"
                                              >
                                                  <IconTrash size={15} />
                                              </button>
                                          </div>
                                      )}

                                      {/* 問題テキスト */}
                                      <div className={`${classSizeQ} leading-relaxed text-center break-words w-full px-8 mb-4 mt-2 select-none pointer-events-none z-0 text-slate-700 dark:text-slate-200`}>
                                          {displayQuestion || '---'}
                                      </div>

                                      {/* 答えテキスト */}
                                      <div className="min-h-[64px] flex items-center justify-center w-full px-2 select-none pointer-events-none z-0">
                                          {isRevealed ? (
                                              <div className={`${classSizeA} font-serif text-blue-700 dark:text-blue-400 text-center animate-reveal`}>
                                                  {displayAnswer}
                                              </div>
                                          ) : (
                                              <div className="h-6 w-16 bg-slate-200/60 dark:bg-slate-800/60 rounded-md animate-pulse" />
                                          )}
                                      </div>
                                  </div>

                                  {/* 聞き取りエリア（音声認識ON時） */}
                                  {settings.enableDictation && !isRevealed && (
                                      <div className="flex flex-col items-center gap-2">
                                          <button
                                              onClick={toggleDictation}
                                              className={`flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold text-sm transition-all ${isListening ? 'bg-red-50 text-red-600 dark:bg-red-950/30 dark:text-red-400 border border-red-200 dark:border-red-800/30' : 'bg-blue-50 text-blue-700 hover:bg-blue-100 dark:bg-blue-950/30 dark:text-blue-300 dark:hover:bg-blue-900/30 border border-blue-200 dark:border-blue-800/30'}`}
                                          >
                                              <IconMic size={18} className={isListening ? 'animate-mic' : ''} />
                                              {isListening ? '聞き取り中...' : '答えを音声で入力'}
                                          </button>
                                          {dictationResult && (
                                              <div className="text-sm text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-4 py-2 rounded-xl">
                                                  認識結果：<span className="font-bold text-slate-800 dark:text-slate-200">{dictationResult}</span>
                                              </div>
                                          )}
                                      </div>
                                  )}

                                  {/* テキスト入力エリア */}
                                  {settings.enableInput && !isRevealed && (
                                      <div className="flex flex-col gap-2">
                                          <div className="flex gap-2">
                                              <input
                                                  ref={inputRef}
                                                  type="text"
                                                  value={inputValue}
                                                  onChange={(e) => { setInputValue(e.target.value); setInputResult(null); }}
                                                  onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); handleInputSubmit(); } }}
                                                  placeholder="答えを入力..."
                                                  className="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold"
                                              />
                                              <button
                                                  onClick={handleInputSubmit}
                                                  disabled={!inputValue.trim()}
                                                  className="px-5 py-3 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-200 dark:disabled:bg-slate-700 disabled:cursor-not-allowed text-white font-bold rounded-xl transition-all text-sm"
                                              >
                                                  確認
                                              </button>
                                          </div>
                                      </div>
                                  )}

                                  {/* 入力判定結果 */}
                                  {inputResult && isRevealed && (
                                      <div className={`text-center py-2 px-4 rounded-xl font-bold text-sm animate-reveal ${inputResult === 'correct' ? 'bg-emerald-50 dark:bg-emerald-950/20 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800/30' : 'bg-rose-50 dark:bg-rose-950/20 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/30'}`}>
                                          {inputResult === 'correct' ? '正解！' : '不正解...'}
                                      </div>
                                  )}

                                  {/* アクションボタン群 */}
                                  <div className="flex flex-col gap-3">
                                      {!isRevealed && !settings.enableInput ? (
                                          <button
                                              onClick={handleReveal}
                                              className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-[0_3px_0_#1e40af] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center leading-tight"
                                          >
                                              <span className="text-base tracking-wide">正解を見る</span>
                                              <span className="text-[10px] font-normal opacity-60 mt-0.5">Space / Enter</span>
                                          </button>
                                      ) : (
                                          <div className="flex gap-3 animate-in fade-in duration-200">
                                              <button
                                                  onClick={() => handleResult(false)}
                                                  className="flex-1 py-3.5 bg-red-500 hover:bg-red-400 dark:bg-red-600 dark:hover:bg-red-500 text-white font-bold rounded-xl shadow-[0_3px_0_#dc2626] dark:shadow-[0_3px_0_#991b1b] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center leading-tight"
                                              >
                                                  <span className="text-base">もう一度</span>
                                                  <span className="text-[10px] font-normal opacity-60 mt-0.5">←</span>
                                              </button>
                                              <button
                                                  onClick={() => handleResult(true)}
                                                  className="flex-1 py-3.5 bg-emerald-500 hover:bg-emerald-400 dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white font-bold rounded-xl shadow-[0_3px_0_#059669] dark:shadow-[0_3px_0_#047857] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center leading-tight"
                                              >
                                                  <span className="text-base">マスター</span>
                                                  <span className="text-[10px] font-normal opacity-60 mt-0.5">→</span>
                                              </button>
                                          </div>
                                      )}
                                  </div>
                              </div>
                          ) : (
                              <div className="flex flex-col items-center justify-center py-10 gap-5 text-center">
                                  <IconCheckCircle size={56} className="text-emerald-500 animate-in zoom-in" />
                                  <div>
                                      <h2 className="text-xl font-bold mb-1.5">すべての学習が完了しました！</h2>
                                      <p className="text-sm text-slate-400 dark:text-slate-500">対象の問題をすべてマスターしました。</p>
                                  </div>
                                  {activeMode !== 'all' && (
                                      <button
                                          onClick={() => { 
                                              const newItems = items.map(i => ({ ...i, sessionDone: false }));
                                              setItems(newItems);
                                              setActiveMode('all'); 
                                              nextQuestion(newItems, 'all'); 
                                          }}
                                          className="w-full py-3.5 mt-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700/80 text-slate-700 dark:text-slate-200 font-bold rounded-xl shadow-[0_3px_0_#94a3b8] dark:shadow-[0_3px_0_#1e293b] active:translate-y-[3px] active:shadow-none transition-all"
                                      >
                                          すべての問題に戻る
                                      </button>
                                  )}
                              </div>
                                      )}
                          </div>

                      {/* タブ分けされた統合設定モーダル */}
                      {modals.menu && (
                          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in fade-in duration-200" onClick={(e) => e.target === e.currentTarget && setModals({...modals, menu: false})}>
                              <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl shadow-xl overflow-hidden flex flex-col max-h-[90vh] border border-slate-100 dark:border-slate-700">
                                  
                                  {/* ヘッダー */}
                                  <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                      <div>
                                          <h3 className="text-base font-bold text-slate-800 dark:text-slate-100">オプション設定</h3>
                                          <p className="text-xs text-slate-400 dark:text-slate-500">お好みの環境にカスタマイズできます</p>
                                      </div>
                                      <button onClick={() => setModals({...modals, menu: false})} className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg"><IconX size={20} /></button>
                                  </div>

                                  {/* タブナビゲーション */}
                                  <div className="flex border-b border-slate-100 dark:border-slate-700 shrink-0 bg-slate-50 dark:bg-slate-900/20 p-1.5 gap-1">
                                      <button
                                          onClick={() => setActiveTab('study')}
                                          className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${activeTab === 'study' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-700/50'}`}
                                      >
                                          学習設定
                                      </button>
                                      <button
                                          onClick={() => setActiveTab('display')}
                                          className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${activeTab === 'display' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-700/50'}`}
                                      >
                                          画面表示
                                      </button>
                                      <button
                                          onClick={() => setActiveTab('preset')}
                                          className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${activeTab === 'preset' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-700/50'}`}
                                      >
                                          プリセット
                                      </button>
                                      <button
                                          onClick={() => setActiveTab('data')}
                                          className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${activeTab === 'data' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-700/50'}`}
                                      >
                                          データ管理
                                      </button>
                                      {LEADERBOARD_URL && (
