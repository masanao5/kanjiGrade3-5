                                                  <p className="text-xs text-slate-400 dark:text-slate-500 leading-normal">
                                                      設定・進捗・問題データをひとつのJSONファイルに保存/復元できます。
                                                  </p>
                                                  <div className="grid grid-cols-2 gap-2">
                                                      <button
                                                          onClick={exportJSON}
                                                          className="py-2.5 flex items-center justify-center gap-2 bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/20 dark:hover:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 font-bold rounded-xl border border-emerald-200 dark:border-emerald-800/30 transition-colors text-xs"
                                                      >
                                                          <IconSave size={14} /> エクスポート
                                                      </button>
                                                      <button
                                                          onClick={importJSON}
                                                          className="py-2.5 flex items-center justify-center gap-2 bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/20 dark:hover:bg-blue-900/30 text-blue-700 dark:text-blue-300 font-bold rounded-xl border border-blue-200 dark:border-blue-800/30 transition-colors text-xs"
                                                      >
                                                          <IconFolderOpen size={14} /> インポート
                                                      </button>
                                                  </div>
                                              </div>

                                              {/* 進捗リセットボタン */}
                                              <div className="pt-4 border-t border-slate-100 dark:border-slate-700/60">
                                                  <button
                                                      onClick={resetAllData}
                                                      className="w-full py-3 flex items-center justify-center gap-2 text-rose-500 font-bold rounded-xl bg-rose-50/50 dark:bg-rose-500/10 hover:bg-rose-100/50 dark:hover:bg-rose-500/20 transition-colors"
                                                  >
                                                      <IconRotateCcw size={18} /> 学習進捗をすべてリセット
                                                  </button>
                                              </div>
                                          </div>
                                      )}

                                      {/* TABS: LEADERBOARD */}
                                      {activeTab === 'leaderboard' && (
                                          <div className="space-y-5 animate-in fade-in duration-150">
                                              {/* 名前設定 */}
                                              <div className="space-y-3 p-4 rounded-2xl bg-amber-50/50 dark:bg-amber-950/10">
                                                  <div className="flex items-center gap-2">
                                                      <IconTrophy size={16} className="text-amber-500" />
                                                      <span className="font-bold text-sm text-amber-600 dark:text-amber-400">リーダーボード設定</span>
                                                  </div>
                                                  <div className="space-y-1.5">
                                                      <label className="font-bold text-xs text-slate-500 dark:text-slate-400">あなたの表示名（ひらがな/カタカナ推奨）</label>
                                                      <input
                                                          type="text"
                                                          value={settings.leaderboardName}
                                                          onChange={(e) => updateSetting('leaderboardName', e.target.value)}
                                                          placeholder="例: たろう"
                                                          className="w-full px-3 py-2 text-xs rounded-xl bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 focus:outline-none focus:border-amber-400 dark:focus:border-amber-500"
                                                      />
                                                  </div>
                                              </div>

                                              {/* ランキング表示 */}
                                              <div className="space-y-3 border-t border-slate-100 dark:border-slate-700 pt-4">
                                                  <div className="flex items-center gap-2 mb-1">
                                                      <span className="font-bold text-sm text-amber-600 dark:text-amber-400">ランキング</span>
                                                  </div>
                                                  <div className="flex gap-1 bg-slate-100 dark:bg-slate-900/60 rounded-xl p-1">
                                                      {[{ id: 'total', label: '総合' },{ id: 'daily', label: '本日' },{ id: 'weekly', label: '今週' },{ id: 'monthly', label: '今月' },{ id: 'streak', label: '連続' },{ id: 'time', label: '時間' }].map(t => (
                                                          <button key={t.id} onClick={() => fetchLeaderboardInline(t.id)} className={`flex-1 py-1.5 text-[10px] font-bold rounded-lg transition-all ${leaderboardType === t.id ? 'bg-white dark:bg-slate-700 text-amber-600 dark:text-amber-400 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}>{t.label}</button>
                                                      ))}
                                                  </div>
                                                  <div className="flex justify-between items-center">
                                                      <span className="text-[10px] text-slate-400">{leaderboardData?.updatedAt ? `更新: ${leaderboardData.updatedAt}` : ''}</span>
                                                      <button onClick={() => fetchLeaderboardInline(leaderboardType)} className="text-xs text-slate-400 hover:text-amber-500 transition-colors">更新</button>
                                                  </div>
                                                  <div className="space-y-1.5 max-h-64 overflow-y-auto">
                                                      {leaderboardLoading && <div className="text-center py-8 text-slate-400 text-xs font-bold">読み込み中...</div>}
                                                      {!leaderboardLoading && leaderboardData?.error && <div className="text-center py-8 text-slate-400 text-xs">{leaderboardData.error}</div>}
                                                      {!leaderboardLoading && leaderboardData?.rankings && leaderboardData.rankings.length === 0 && <div className="text-center py-8 text-slate-400 text-xs font-bold">まだデータがありません</div>}
                                                      {!leaderboardLoading && leaderboardData?.rankings && leaderboardData.rankings.map((r, i) => {
                                                          const rankColors = ['text-amber-500', 'text-slate-400', 'text-orange-700'];
                                                          const bgColors = ['bg-amber-50/50 dark:bg-amber-950/20', 'bg-slate-50 dark:bg-slate-800/40', 'bg-orange-50/30 dark:bg-orange-950/10'];
                                                          const rank = r.rank || (i + 1);
                                                          return (<div key={r.userId || i} className={`flex items-center gap-2.5 px-3 py-2 rounded-lg ${rank <= 3 ? bgColors[rank-1] : 'bg-white dark:bg-slate-800/20'}`}><span className={`w-6 text-center font-bold text-xs ${rank <= 3 ? rankColors[rank-1] : 'text-slate-400'}`}>{rank}</span><span className="flex-1 text-xs font-bold text-slate-700 dark:text-slate-200 truncate">{r.userName}</span><span className="text-xs font-bold text-amber-600 dark:text-amber-400 shrink-0">{leaderboardType === 'streak' ? `${r.streak || r.mastered}日` : leaderboardType === 'time' ? `${Math.floor((r.seconds || r.mastered) / 60)}分` : `${r.mastered}問`}</span></div>);
                                                      })}
                                                  </div>
                                                  <button onClick={openLeaderboard} className="w-full py-2.5 flex items-center justify-center gap-2 bg-amber-50 hover:bg-amber-100 dark:bg-amber-950/20 dark:hover:bg-amber-900/30 text-amber-700 dark:text-amber-300 font-bold rounded-xl border border-amber-200 dark:border-amber-800/30 transition-colors text-xs">別窓で開く</button>
                                              </div>
                                          </div>
                                      )}
                                  </div>

                                  {/* フッター */}
                                  <div className="p-4 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700 flex justify-end items-center shrink-0">
                                      <button
                                          onClick={() => setModals({...modals, menu: false})}
                                          className="py-2.5 px-6 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition-all"
                                      >
                                          閉じる
                                      </button>
                                  </div>
                              </div>
                          </div>
                      )}

                      {/* 問題リスト・集中学習 モーダル */}
                      {modals.list && (
                          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, list: false})}>
                              <div className="bg-white dark:bg-slate-800 w-full max-w-2xl h-[85vh] flex flex-col rounded-3xl shadow-xl overflow-hidden animate-in fade-in zoom-in-95 duration-200 border border-slate-100 dark:border-slate-700">
                                  <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                      <h3 className="text-lg font-bold">問題リスト</h3>
                                      <button onClick={() => setModals({...modals, list: false, menu: true})} className="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><IconX size={24} /></button>
                                  </div>

                                  <div className="flex gap-1.5 p-3 overflow-x-auto border-b border-slate-100 dark:border-slate-700 shrink-0 no-scrollbar bg-slate-50/50 dark:bg-slate-900/30">
                                      {[
                                          { id: 'all', label: 'すべて' },
                                          { id: 'star', label: '★ 要復習' },
                                          { id: 'ng', label: '未マスター' },
                                          { id: 'ok', label: 'マスター済' }
                                      ].map(f => (
                                          <button
                                              key={f.id}
                                              onClick={() => setListFilter(f.id)}
                                              className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-colors ${listFilter === f.id ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'}`}
                                          >
                                              {f.label}
                                          </button>
                                      ))}
                                  </div>

                                  <div className="flex-1 overflow-y-auto p-4 space-y-2.5">
                                      {items.filter(i => {
                                          if (listFilter === 'star') return i.star;
                                          if (listFilter === 'ng') return !i.ok;
                                          if (listFilter === 'ok') return i.ok;
                                          return true;
                                      }).map(item => (
                                          <div key={item.id} className="flex gap-4 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 bg-slate-50/30 dark:bg-slate-800/40">
                                              <div className="flex flex-col gap-3 items-center shrink-0">
                                                  {item.ok ? <IconCheckCircle size={20} className="text-emerald-500 animate-in zoom-in-50" /> : <div className="w-5 h-5 rounded-full border-2 border-slate-200 dark:border-slate-700" />}
                                                  <button onClick={() => toggleStar(item.id)}>
                                                      <IconStar size={20} className={item.star ? "text-amber-400" : "text-slate-300 dark:text-slate-700"} fill={item.star ? "currentColor" : "none"} />
                                                  </button>
                                              </div>
                                              <div>
                                                  <div className="font-bold mb-1 leading-snug">{item.q}</div>
                                                  <div className="text-sm font-serif text-blue-700 dark:text-blue-400 font-bold">{item.a}</div>
                                              </div>
                                          </div>
                                      ))}
                                      {items.filter(i => {
                                          if (listFilter === 'star') return i.star;
                                          if (listFilter === 'ng') return !i.ok;
                                          if (listFilter === 'ok') return i.ok;
                                          return true;
                                      }).length === 0 && (
                                          <div className="text-center p-10 text-slate-400 font-bold italic">該当する問題がありません</div>
                                      )}
                                  </div>

                                  <div className="p-4 border-t border-slate-100 dark:border-slate-700 shrink-0 bg-white dark:bg-slate-800 flex gap-3">
                                      <button
                                          onClick={() => setModals({...modals, list: false, menu: true})}
                                          className="py-3.5 px-6 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 font-bold rounded-xl text-sm"
                                      >
                                          戻る
                                      </button>
                                      <button
                                          onClick={startFocusedLearning}
                                          disabled={items.filter(i => listFilter==='star'?i.star : listFilter==='ng'?!i.ok : listFilter==='ok'?i.ok : true).length === 0}
                                          className="flex-1 py-3.5 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-200 dark:disabled:bg-slate-800 disabled:cursor-not-allowed text-white font-bold rounded-xl active:scale-[0.98] disabled:scale-100 transition-all text-sm"
                                      >
                                          表示中の条件で集中学習を開始
                                      </button>
                                  </div>
                              </div>
                          </div>
                      )}

                      {/* 問題データの編集モーダル */}
                      {modals.edit && (
                          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, edit: false})}>
                              <div className="bg-white dark:bg-slate-800 w-full max-w-xl h-[85vh] flex flex-col rounded-3xl shadow-xl overflow-hidden animate-in fade-in zoom-in-95 duration-200 border border-slate-100 dark:border-slate-700">
                                  <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700 shrink-0">
                                      <h3 className="text-lg font-bold">問題データの編集</h3>
                                      <button onClick={() => setModals({...modals, edit: false, menu: true})} className="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><IconX size={24} /></button>
                                  </div>

                                  <div className="flex-1 p-4 flex flex-col gap-3 min-h-0">
                                      <p className="text-xs text-slate-500 dark:text-slate-400 leading-normal bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800">
                                          Excelやスプレッドシートからコピーしたデータをそのまま貼り付けられます。<br />
                                          フォーマット：<span className="font-bold bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded text-blue-700 dark:text-blue-400 font-mono">問題 [スペース か タブ か カンマ] 答え</span>
                                      </p>
                                      <textarea
                                          value={tempRawText}
                                          onChange={(e) => setTempRawText(e.target.value)}
                                          className="flex-1 w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none transition-all"
                                          placeholder="ここに問題を貼り付けます&#13;例：&#13;apple	りんご&#13;banana	バナナ"
                                      />
                                  </div>

                                  <div className="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 flex gap-3 shrink-0">
                                      <button
                                          onClick={resetToDefaultData}
                                          className="px-4 py-3.5 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold rounded-xl transition-all text-sm"
                                      >
                                          デフォルトに戻す
                                      </button>
                                      <button
                                          onClick={() => setModals({...modals, edit: false, menu: true})}
                                          className="px-4 py-3.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 font-bold rounded-xl text-sm text-slate-500 dark:text-slate-300"
                                      >
                                          戻る
                                      </button>
                                      <button
                                          onClick={applyCustomData}
                                          className="flex-1 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl active:scale-[0.98] transition-all text-sm shadow-[0_3px_0_#1e40af]"
                                      >
                                          適用して学習を開始
                                      </button>
                                  </div>
                              </div>
                          </div>
                      )}

                      {/* 出典表示 */}
                      <div className="mt-8 text-center px-4">
                          <p className="text-[10px] sm:text-xs text-slate-400 dark:text-slate-500 tracking-wide leading-relaxed">
                              出典：新学社「漢字練習字典」 (編集から自由に問題を変更可能です)
                          </p>
                      </div>

                  </div>

                  {/* 右側キャンバスパネル */}
                  {settings.showCanvas && settings.canvasPosition === 'right' && !isFinished && (
                      <div className="w-72 shrink-0 sticky top-4" style={{ zoom: settings.displayScale }}>
                          <div className="bg-white dark:bg-slate-900 p-4 rounded-3xl shadow-lg border border-slate-200/60 dark:border-slate-800/80">
                              <div className="flex items-center justify-between mb-3">
                                  <h3 className="text-sm font-bold text-slate-500 dark:text-slate-400">手書きキャンバス</h3>
                                  <button
                                      onClick={() => updateSetting('canvasPosition', 'overlay')}
                                      className="p-1 text-slate-400 hover:text-blue-500 dark:hover:text-blue-400 rounded-lg transition-colors"
                                      title="右パネルを閉じる"
                                  >
                                      <IconX size={14} />
                                  </button>
                              </div>
                              <div className="relative rounded-2xl overflow-hidden border border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/30" style={{aspectRatio: '3/4'}}>
                                  <canvas
                                      ref={canvasRightRef}
                                      onPointerDown={startDrawing}
                                      onPointerMove={draw}
                                      onPointerUp={stopDrawing}
                                      onPointerLeave={stopDrawing}
                                      onMouseDown={startDrawing}
                                      onMouseMove={draw}
                                      onMouseUp={stopDrawing}
                                      onMouseLeave={stopDrawing}
                                      onTouchStart={startDrawing}
                                      onTouchMove={draw}
                                      onTouchEnd={stopDrawing}
                                      className="w-full h-full cursor-crosshair"
                                      style={{ touchAction: 'none' }}
                                  />
                              </div>
                              <button
                                  onClick={clearCanvas}
                                  className="mt-3 w-full py-2 flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 rounded-xl text-xs font-bold transition-all"
                              >
                                  <IconTrash size={14} /> 消去
                              </button>
                          </div>
                      </div>
                  )}

              </div>

              {/* トースト通知 */}
              <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 dark:bg-slate-700 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300 z-50 ${toast.visible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
                  {toast.message}
              </div>

          </div>
          );

      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
  </script>
</body>
</html>
